services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.4"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_APP_PASSWORD: "${AUDIT_APP_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "ecommerce.apphost-4bbdf6ccdc-postgres-data"
        read_only: false
      - type: "bind"
        target: "/docker-entrypoint-initdb.d/001-databases.sh"
        source: "${POSTGRES_BINDMOUNT_0}"
        read_only: false
    networks:
      - "aspire"
  rabbitmq:
    image: "docker.io/library/rabbitmq:4.3.1-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "15672"
    expose:
      - "5672"
    volumes:
      - type: "volume"
        target: "/var/lib/rabbitmq"
        source: "ecommerce.apphost-4bbdf6ccdc-rabbitmq-data"
        read_only: false
    networks:
      - "aspire"
  valkey:
    image: "docker.io/valkey/valkey:9.1"
    command:
      - "-c"
      - "valkey-server --requirepass $$VALKEY_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  keycloak:
    image: "quay.io/keycloak/keycloak:26.6.4"
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    ports:
      - "8080"
    volumes:
      - type: "bind"
        target: "/opt/keycloak/data/import/realm-export.json"
        source: "${KEYCLOAK_BINDMOUNT_0}"
        read_only: false
      - type: "volume"
        target: "/opt/keycloak/data"
        source: "keycloak-data"
        read_only: false
    networks:
      - "aspire"
  order-api:
    image: "${ORDER_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${ORDER_API_PORT}"
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=Order_db"
      ORDERDB_HOST: "postgres"
      ORDERDB_PORT: "5432"
      ORDERDB_USERNAME: "postgres"
      ORDERDB_PASSWORD: "${POSTGRES_PASSWORD}"
      ORDERDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/Order_db"
      ORDERDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/Order_db"
      ORDERDB_DATABASENAME: "Order_db"
      ConnectionStrings__rabbitmq: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__valkey: "valkey:6379,password=${VALKEY_PASSWORD}"
      VALKEY_HOST: "valkey"
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
      VALKEY_URI: "valkey://:${VALKEY_PASSWORD}@valkey:6379"
      Jwt__Authority: "http://keycloak:8080/realms/ecommerce"
      Jwt__ValidateIssuer: "true"
      INVENTORY_API_HTTP: "http://inventory-api:${INVENTORY_API_PORT}"
      services__inventory-api__http__0: "http://inventory-api:${INVENTORY_API_PORT}"
      INVENTORY_API_HTTPS: "https://inventory-api:${INVENTORY_API_PORT}"
      CATALOG_API_HTTP: "http://catalog-api:${CATALOG_API_PORT}"
      services__catalog-api__http__0: "http://catalog-api:${CATALOG_API_PORT}"
      CATALOG_API_HTTPS: "https://catalog-api:${CATALOG_API_PORT}"
      PROMOTION_API_HTTP: "http://promotion-api:${PROMOTION_API_PORT}"
      services__promotion-api__http__0: "http://promotion-api:${PROMOTION_API_PORT}"
      PROMOTION_API_HTTPS: "https://promotion-api:${PROMOTION_API_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "Order-api"
    expose:
      - "${ORDER_API_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      rabbitmq:
