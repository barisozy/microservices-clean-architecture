name: Search API CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Services/Search/**'
      - 'src/BuildingBlocks/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/search-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Services/Search/**'
      - 'src/BuildingBlocks/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/search-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/search-api

jobs:
  build-and-test:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dependency vulnerability scan
        run: |
          dotnet list src/Services/Search/Search.Api/Search.Api.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::HIGH or CRITICAL vulnerabilities found. See vuln-report.txt"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Restore Dependencies
        run: |
          dotnet restore src/Services/Search/Search.Api/Search.Api.csproj

      - name: Build Project (CodeQL Traced)
        run: |
          dotnet build src/Services/Search/Search.Api/Search.Api.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Search unit tests
        uses: ./.github/actions/run-dotnet-tests
        with:
          project: tests/Search.UnitTests/Search.UnitTests.csproj
          result-name: search

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Extract metadata for Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/Search/Search.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate and attach SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign the published Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
