name: Test & Code Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: Run Tests and Generate Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ECommerce.sln

      - name: Unit tests with coverage
        run: |
          dotnet test ECommerce.UnitTests.slnf \
            --configuration Release \
            --no-restore \
            --disable-build-servers \
            -m:1 \
            --settings coverage.runsettings \
            --logger "trx;LogFilePrefix=unit" \
            --results-directory artifacts/test-results/unit

      - name: Integration tests
        run: |
          dotnet test ECommerce.IntegrationTests.slnf \
            --configuration Release \
            --no-restore \
            --disable-build-servers \
            -m:1 \
            --logger "trx;LogFilePrefix=integration" \
            --results-directory artifacts/test-results/integration

      - name: Contract tests
        run: |
          dotnet test ECommerce.ContractTests.slnf \
            --configuration Release \
            --no-restore \
            --disable-build-servers \
            -m:1 \
            --logger "trx;LogFilePrefix=contract" \
            --results-directory artifacts/test-results/contract

      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'artifacts/test-results/unit/*/coverage.cobertura.xml'
          targetdir: 'artifacts/coverage/core'
          reporttypes: 'Html;MarkdownSummary;JsonSummary'
          assemblyfilters: '+*.Domain;+*.Application;+ECommerce.Audit'

      - name: Publish Summary to GitHub Step Summary
        run: cat artifacts/coverage/core/Summary.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce Production Coverage Threshold (Min 80%)
        run: |
          COVERAGE=$(jq -r '.summary.linecoverage // 0' artifacts/coverage/core/Summary.json)
          echo "COVERAGE_PERCENTAGE=$COVERAGE" >> $GITHUB_ENV
          python3 -c "import sys; sys.exit(0 if float('$COVERAGE') >= 80.0 else 1)" || {
            echo "::error::Domain/Application line coverage is ${COVERAGE}%; minimum threshold is 80%."
            exit 1
          }

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/unit/*/coverage.cobertura.xml
            artifacts/coverage/core
          if-no-files-found: warn
          retention-days: 14

      - name: Create Coverage Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        if: github.ref == 'refs/heads/main'
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: coverage.json
          label: Core Test Coverage
          message: ${{ env.COVERAGE_PERCENTAGE }}%
          color: green
